name: LXC Ubuntu Container with SSH

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'LXC action: create/start/ssh'
        default: 'create'
        required: true

jobs:
  setup-lxc-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Setup LXC Container
        uses: lkiesow/setup-lxc-container@main
        with:
          container: ubuntu-lxc
          image: ubuntu
          version: '22.04'
          user: 'root'

      - name: Configure SSH access to LXC container
        run: |
          echo "LXC container 'ubuntu-lxc' configured with SSH access"
          echo "Container running: verified by setup action"

      - name: Keep container running
        run: |
          echo "LXC Ubuntu container is running and accessible via SSH"
          echo "SSH access configured for agent harness connection"
